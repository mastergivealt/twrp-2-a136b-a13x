name: Build TWRP (SM-A136B)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        default: "twrp-12.1"
      include_vbmeta:
        description: "Also flash a verification-disabled vbmeta (leave false unless you know you need it)"
        type: choice
        options: ["false", "true"]
        default: "false"
      crypto:
        description: "Try data decryption (false = safest first boot test)"
        type: choice
        options: ["false", "true"]
        default: "false"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check that the stock recovery is present
        run: |
          test -f stock/recovery.img || { echo "::error::put your stock recovery.img into stock/ (see README)"; exit 1; }
          ls -l stock probe || true

      - name: Analyze the stock recovery (report)
        run: |
          sudo apt-get install -y lz4 cpio xz-utils >/dev/null
          mkdir -p out
          python3 tools/analyze_stock.py stock/recovery.img | tee out/stock_report.txt
          { echo '### Stock recovery report'; echo '```'; cat out/stock_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            bc cpio lz4 ccache rsync libssl-dev openjdk-11-jdk
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@example.invalid"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b "${{ inputs.manifest_branch }}"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Add device tree and generate it from the stock recovery
        run: |
          cd ~/twrp
          mkdir -p device/samsung/a13x
          cp -r "$GITHUB_WORKSPACE"/device/samsung/a13x/. device/samsung/a13x/
          python3 "$GITHUB_WORKSPACE"/tools/gen_from_stock.py \
            "$GITHUB_WORKSPACE"/stock/recovery.img device/samsung/a13x "$GITHUB_WORKSPACE"/probe
          cat device/samsung/a13x/generated.mk

      - name: Build recovery image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export CRYPTO="${{ inputs.crypto }}"
          source build/envsetup.sh
          lunch twrp_a13x-eng
          mka recoveryimage -j"$(nproc)"

      - name: Make the ramdisk match the stock one (compression + MediaTek header)
        run: |
          cd ~/twrp
          G=device/samsung/a13x/generated.mk
          COMP=$(sed -n 's/^GEN_RAMDISK_COMP := //p' $G)
          IMG=$(find out/target/product -name recovery.img | head -n1)
          ARGS=""
          case "$COMP" in gzip|lz4|xz|lzma) ARGS="--comp $COMP";; esac
          if grep -q "GEN_MTK_RAMDISK := true" $G; then
            ARGS="$ARGS --mtk $(sed -n 's/^GEN_MTK_RAMDISK_NAME := //p' $G)"
          fi
          echo "fix_ramdisk args: $ARGS"
          python3 "$GITHUB_WORKSPACE"/tools/fix_ramdisk.py "$IMG" $ARGS --stock "$GITHUB_WORKSPACE"/stock/recovery.img

      - name: Package for Odin
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          IMG=$(find ~/twrp/out/target/product -name recovery.img | head -n1)
          test -n "$IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/out/recovery.img"
          cd "$GITHUB_WORKSPACE/out"
          # the stock recovery partition is exactly this big (size of the dumped recovery.img)
          LIMIT=$(stat -c %s ../stock/recovery.img)
          SIZE=$(stat -c %s recovery.img)
          echo "recovery.img = $SIZE bytes, partition = $LIMIT bytes"
          echo "### Size: $SIZE / $LIMIT bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ $((SIZE + 64)) -gt "$LIMIT" ]; then
            echo "::error::recovery.img ($SIZE) does not fit the recovery partition ($LIMIT). Not packaging an Odin tar. Shrink TWRP (fewer languages/tools)."
            exit 1
          fi
          # Samsung bootloaders want this marker at the end of boot-type images
          printf 'SEANDROIDENFORCE' >> recovery.img
          FILES="recovery.img"
          if [ "${{ inputs.include_vbmeta }}" = "true" ] && [ -f ../stock/vbmeta.img ]; then
            python3 ../tools/patch_vbmeta.py ../stock/vbmeta.img vbmeta.img
            FILES="recovery.img vbmeta.img"
          fi
          tar -H ustar -c $FILES > TWRP_A136B_AP.tar
          md5sum TWRP_A136B_AP.tar > TWRP_A136B_AP.tar.md5
          ls -l

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a136b
          path: |
            out/*
            out/stock_report.txt
            ~/twrp/out/target/product/*/recovery.img
            ~/twrp/out/target/product/*/obj/PACKAGING/recovery_patch_intermediates/*
            ~/twrp/device/samsung/a13x/generated.mk
          if-no-files-found: warn
